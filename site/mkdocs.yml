# MkDocs config for the read-only brain site. scripts/build-site.sh copies this
# beside a `docs/` export of the brain; nothing here lives in the brain itself.
site_name: Brain
docs_dir: docs
theme:
  name: material
  custom_dir: overrides # sw.js registration, manifest, reset link
  # Material would otherwise load its fonts from Google. The site makes no
  # requests off its own origin; system fonts it is.
  font: false
  features:
    - navigation.tabs # top-level folders as tabs (shown on phones by extra.css)
    - navigation.indexes # a folder's index.md is the folder's own page
    - navigation.path # breadcrumbs above each page
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
extra_css:
  - extra.css
# The brain holds the odd HTML file (a review template). Publish notes only.
# (Its script files are deleted by build-site.sh: a pattern here would also
# drop the theme's own JavaScript.)
exclude_docs: |
  *.html
plugins:
  - search # on by default, but naming any plugin turns the defaults off
  - awesome-nav # sidebar order, from nav.yml
