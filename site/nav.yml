# Tabs for the brain site, in order. scripts/build-site.sh copies this into the
# export as `.nav.yml`, where the awesome-nav plugin reads it. The folders come
# in the order you work through them rather than alphabetically; a folder the
# brain does not have yet is skipped. These are the site's tabs, so only the
# folders worth a tab are named; the landing page's "Everything" lists the rest.
nav:
  - index.md
  - inbox
  - projects
  - areas
  - resources
