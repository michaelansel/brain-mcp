[project]
name = "brain-mcp"
version = "0.1.0"
description = "MCP server exposing a git-backed markdown brain to AI surfaces"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0,<3",
    "pyyaml>=6.0",
]

[project.scripts]
brain-mcp = "brain_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
