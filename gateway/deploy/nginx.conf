# nginx routing for the OAuth gateway + brain-mcp.
#
# exe.dev's proxy is the only thing that talks to this. It terminates TLS and
# forwards plain HTTP to whatever's listening on the `share port`-targeted
# port (127.0.0.1:8000 below) — nginx takes that role instead of brain-mcp
# listening there directly.
#
# This file is a template. Deploy the output of render-nginx.sh, which fills
# in the two identities below from the environment:
#
#   BRAIN_OWNER_EMAIL         replaces allowed-email@example.com — the exe.dev
#                             account email already on brain-mcp's
#                             BRAIN_MCP_EXEDEV_EMAILS allowlist. That's the
#                             identity the
#                             gateway's minted VM tokens resolve to, and
#                             the only one that should ever reach /mcp.
#   BRAIN_SITE_READER_EMAILS  optional, comma-separated: people who may read
#                             the site at /site/ and nothing else.
#
# Both are literal string matches (not regexes) deliberately: an unescaped
# "." in a regex-style match matches any character, which would accept
# lookalike addresses. nginx compares map strings ignoring case, as brain-mcp's
# own allowlist does. Never put a site reader on BRAIN_MCP_EXEDEV_EMAILS:
# exe.dev forwards other ports straight to the VM for anyone it lets in, so
# brain-mcp's own allowlist, not this file, is what keeps a reader off its
# port.

map $http_x_exedev_email $mcp_authorized {
    default 0;
    "allowed-email@example.com" 1;
}

# Readers of the site. They get /site/ (and / which redirects there) and
# nothing else: /mcp answers them exactly as it answers a stranger.
map $http_x_exedev_email $site_reader {
    default 0;
    # @SITE_READERS@
}

# Default closed. Every request must carry the allowed identity above, except
# for the paths listed here — the OAuth dance, which has to work for a caller
# who has no identity yet and so relies on exe.dev's edge alone. This list is
# the ONLY way a path becomes reachable without the header: a location added
# below is closed until it is named here, which is what keeps a new route from
# being exposed by accident while the VM is `share set-public`.
#
# $uri is nginx's normalised path ("..", "//" and percent-encoding already
# resolved), so a request cannot spell its way onto this list.
map $uri $edge_only {
    default 0;
    /.well-known/oauth-authorization-server 1;
    /.well-known/oauth-protected-resource   1;
    /authorize                              1;
    /auth/github/callback                   1;
    /register                               1;
    /token                                  1;
}

# What to answer a request, from "<edge_only><mcp_authorized><site_reader>:<path>".
# Empty lets it through. A closed path answers 404, exactly as a path that
# does not exist would, so nothing here reveals what is behind the login. /mcp
# is the one exception: Claude's connector needs a 401 to learn it should
# start an OAuth flow. Exact keys win over regexes, so a site reader asking
# for /mcp gets the same 401 as anyone else without the owner's identity.
map "$edge_only$mcp_authorized$site_reader:$uri" $deny {
    default                 404;
    "000:/mcp"              401;
    "001:/mcp"              401;
    ~^(1..|.1.):            "";
    ~^001:/(site(/.*)?)?$   "";
}

# HTML pages from the brain run in a sandbox. The site publishes every .html
# file in the brain as written, script included; the sandbox gives each one an
# opaque origin, so its script runs but cannot reach this origin's service
# worker, caches, storage or cookies. Every page MkDocs renders is an
# index.html, which build-site.sh guarantees is never a brain file, so those
# are exempt. site/sw.js applies the same rule and the same policy to the
# copies it serves offline; tests/test_build_site.py checks the two match.
#   allow-forms         a form's submit event never fires without it
#   allow-popups(-to-escape-sandbox)  a target=_blank link opens a normal page
#   allow-modals        alert() and confirm()
# Never allow-same-origin: it would undo the sandbox. Regexes are tried in order.
map $uri $site_sandbox {
    default "";
    ~*/index\.html$ "";
    ~*\.html$ "sandbox allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads";
}

# exe.dev's edge always connects to nginx from 127.0.0.1 — without this, $remote_addr
# (what `allow`/`deny` below actually check) is always 127.0.0.1 regardless of who the
# original caller was, silently turning the Anthropic-IP restriction into "block
# everyone, including Anthropic." exe.dev appends the real client IP to
# X-Forwarded-For (see ../README.md's proxy header docs), so trust that from the one
# hop we know is exe.dev itself.
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;

server {
    listen 127.0.0.1:8000;
    server_name _;

    # The default-closed rule (see $deny above). It runs before any location is
    # chosen, so no location below can opt out of it.
    if ($deny = 401) { return 401; }
    if ($deny = 404) { return 404; }

    # nginx is behind a TLS-terminating proxy on another port; an absolute
    # redirect would name http:// and :8000.
    absolute_redirect off;

    # Discovery: always reachable, regardless of the identity header — this is
    # inherent to OAuth, and Claude's own docs note discovery requests can come
    # from the same IP range as MCP calls, so no extra restriction is needed
    # (it's non-sensitive, publicly-fine-to-read metadata anyway).
    location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource)$ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
    }

    # Browser-facing steps of the OAuth dance: the user's own browser lands
    # here (redirected by Claude, then by GitHub), so these can't be
    # IP-restricted to Anthropic's range — the browser could be anywhere.
    location = /authorize {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
    }

    location = /auth/github/callback {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
    }

    # Server-to-server steps: DCR and the token exchange are only ever called
    # by Claude's own backend, never a browser, so these can be restricted to
    # Anthropic's published outbound range on top of the redirect_uri
    # allowlist — defense in depth against exactly the "third party registers
    # their own client" class of attack the allowlist already closes.
    # https://platform.claude.com/docs/en/api/ip-addresses (confirm this is
    # still current before relying on it — Anthropic states it won't change
    # without notice, but "won't" isn't "can't").
    location = /register {
        allow 160.79.104.0/21;
        deny all;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
    }

    location = /token {
        allow 160.79.104.0/21;
        deny all;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
    }

    # The actual MCP endpoint: only reachable once exe.dev has already
    # verified the caller (browser login or a valid VM token) and injected
    # the identity header. No token parsing happens here at all — the
    # default-closed rule above has already checked that exe.dev's own
    # verification succeeded.
    location = /mcp {
        # Not reachable from a web page. Browsers attach Sec-Fetch-Site to
        # every request and page script can neither remove nor forge it; MCP
        # clients are not browsers and never send it. Without this, script in
        # a page served from this origin (a note on the site below) could call
        # the brain's write tools with the viewer's own login.
        if ($http_sec_fetch_site) {
            return 403;
        }
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-ExeDev-Email $http_x_exedev_email;
        proxy_set_header X-ExeDev-Token-Ctx $http_x_exedev_token_ctx;
    }

    # A bare 403 would leave Claude's connector with no idea it should start
    # an OAuth flow — it needs a spec-shaped challenge pointing at discovery.
    error_page 401 = @oauth_challenge;
    location @oauth_challenge {
        default_type application/json;
        add_header WWW-Authenticate 'Bearer resource_metadata="https://$host/.well-known/oauth-protected-resource"' always;
        return 401 '{"error":"unauthorized"}';
    }

    # The read-only site of the brain, published by scripts/build-site.sh.
    # `current` is a symlink that script swaps atomically. Nothing here checks
    # identity because the default-closed rule already has: the owner and any
    # site reader get this far, nobody else does.
    location /site/ {
        alias /var/www/brain-site/current/;
        # Revalidate every time, so an online load is the current build. The
        # phone's offline copy is the service worker's (sw.js), not this cache.
        add_header Cache-Control "no-cache";
        # The brain's HTML pages, sandboxed (see $site_sandbox). An empty value
        # sends no header. Kept here rather than in a nested location, which
        # would drop the Cache-Control above.
        add_header Content-Security-Policy $site_sandbox always;
        # Saving the site for offline fetches all of it; compress all of it.
        # Without gzip_proxied nothing is, as every request comes via exe.dev.
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    }

    location = /site {
        return 302 /site/;
    }

    location = / {
        return 302 /site/;
    }

    location / {
        return 404;
    }
}
