[project]
name = "oauth-gateway"
version = "0.1.0"
description = "OAuth 2.1 + DCR gateway bridging Claude.ai's connector to brain-mcp via exe.dev VM tokens"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.38",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
oauth-gateway = "oauth_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oauth_gateway"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # starlette nudges toward an optional httpx2 dependency for TestClient;
    # not worth adding another dependency for a test-only convenience wrapper.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
